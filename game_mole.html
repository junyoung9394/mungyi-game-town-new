@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{
  --bg:#0c0820;--surface:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.13);
  --pink:#FF85A1;--mint:#5EDFCA;--lavender:#C4B5FF;--peach:#FFB07C;--yellow:#FFE97F;
  --glass-bg:rgba(255,255,255,0.07);--glass-blur:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:var(--bg);display:flex;justify-content:center;min-height:100vh;}
.app{width:100%;max-width:420px;min-height:100vh;background:linear-gradient(160deg,#110828 0%,#0c0820 60%,#160a30 100%);display:flex;flex-direction:column;position:relative;overflow:hidden;}

.app::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(196,181,255,0.04) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(255,133,161,0.04) 0%,transparent 60%);pointer-events:none;z-index:0;}

.header{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));border-bottom:1px solid var(--border);padding:14px 62px 14px 18px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10;}
.title{font-family:'Jua',sans-serif;font-size:20px;background:linear-gradient(135deg,var(--pink),var(--lavender));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.coin-box{background:rgba(255,231,127,0.12);border:1px solid rgba(255,231,127,0.25);border-radius:20px;padding:6px 14px;color:var(--yellow);font-weight:800;font-size:15px;}

.hud{display:flex;gap:8px;padding:12px 16px 8px;position:relative;z-index:1;}
.hud-stat{background:var(--glass-bg);border:1px solid var(--border);border-radius:16px;padding:10px 12px;flex:1;text-align:center;backdrop-filter:blur(10px);}
.hud-n{font-family:'Jua',sans-serif;font-size:22px;}
.hud-n.pink{color:var(--pink);}
.hud-n.mint{color:var(--mint);}
.hud-n.lav{color:var(--lavender);}
.hud-l{font-size:10px;color:rgba(255,255,255,0.5);font-weight:700;margin-top:2px;}

.timer-wrap{padding:0 16px 10px;position:relative;z-index:1;}
.timer-bg{height:10px;background:rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;border:1px solid var(--border);}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));border-radius:8px;transition:width 0.1s linear;position:relative;}
.timer-fill::after{content:'';position:absolute;top:1px;left:4px;right:4px;height:3px;background:rgba(255,255,255,0.4);border-radius:2px;}

.grid-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px;position:relative;z-index:1;}
.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;}

.hole{position:relative;aspect-ratio:1;cursor:pointer;}
.hole-ground{
  position:absolute;bottom:0;left:0;right:0;
  height:72%;
  background:radial-gradient(ellipse at 50% 30%,#2a1f4e 0%,#1a1035 100%);
  border-radius:50% 50% 0 0 / 42% 42% 0 0;
  border:2px solid rgba(196,181,255,0.25);
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.4),inset 0 -4px 12px rgba(0,0,0,0.3);
}
.hole-shadow{
  position:absolute;top:60%;left:10%;right:10%;
  height:40%;
  background:rgba(0,0,0,0.5);
  border-radius:50%;
  filter:blur(4px);
}
.mole{
  position:absolute;
  bottom:55%;
  left:50%;transform:translateX(-50%);
  font-size:44px;
  line-height:1;
  transition:bottom 0.12s cubic-bezier(.34,1.56,.64,1);
  user-select:none;
  z-index:5;
  filter:drop-shadow(0 -4px 12px rgba(196,181,255,0.4));
}
.mole.hidden{bottom:-20%;}
.mole.bonk{animation:bonk 0.3s ease;}
@keyframes bonk{0%{transform:translateX(-50%)scale(1);}30%{transform:translateX(-50%)scale(0.7)rotate(-15deg);}100%{transform:translateX(-50%)scale(1);}}

.score-pop{
  position:absolute;
  top:10%;left:50%;transform:translateX(-50%);
  font-family:'Jua',sans-serif;
  font-size:20px;
  color:white;
  text-shadow:0 0 12px var(--pink);
  pointer-events:none;
  animation:pop-up 0.7s ease-out forwards;
  z-index:20;
  white-space:nowrap;
}
@keyframes pop-up{0%{opacity:1;transform:translateX(-50%)translateY(0);}100%{opacity:0;transform:translateX(-50%)translateY(-50px);}}

.screen{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(8,4,20,0.85);
  backdrop-filter:blur(8px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:100;
}
.screen-card{
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:28px;
  padding:32px 28px;text-align:center;
  width:85%;max-width:320px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(196,181,255,0.05);
  backdrop-filter:blur(20px);
}
.screen-emoji{font-size:64px;display:block;margin-bottom:12px;}
.screen-title{font-family:'Jua',sans-serif;font-size:24px;background:linear-gradient(135deg,var(--pink),var(--lavender));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;}
.screen-score{font-family:'Jua',sans-serif;font-size:44px;color:var(--yellow);margin:8px 0;text-shadow:0 0 20px rgba(255,233,127,0.4);}
.screen-sub{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px;line-height:1.6;}
.screen-coin{font-size:17px;font-weight:800;color:var(--yellow);margin-bottom:12px;}
.screen-best{font-size:13px;font-weight:800;color:var(--mint);margin-bottom:16px;}
.screen-btn{background:linear-gradient(135deg,var(--pink),var(--lavender));color:white;border:none;border-radius:20px;padding:14px 40px;font-family:'Jua',sans-serif;font-size:18px;cursor:pointer;box-shadow:0 6px 20px rgba(255,133,161,0.35);transition:all 0.18s cubic-bezier(.34,1.56,.64,1);width:100%;margin-bottom:10px;}
.screen-btn:active{transform:scale(0.94);}
.screen-btn-sec{background:var(--surface);border:1px solid var(--border);color:var(--lavender);border-radius:20px;padding:12px;font-family:'Jua',sans-serif;font-size:15px;cursor:pointer;transition:all 0.18s;width:100%;margin-bottom:8px;}
.screen-btn-sec:active{opacity:0.75;}
.share-btn{background:linear-gradient(135deg,#FEE500,#FFB700);color:#3C1E1E;border:none;border-radius:20px;padding:12px;font-family:'Jua',sans-serif;font-size:15px;cursor:pointer;transition:all 0.18s;width:100%;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:900;}
.share-btn:active{opacity:0.75;}
.new-record-badge{background:linear-gradient(135deg,var(--yellow),var(--peach));color:#1a0a00;font-family:'Jua',sans-serif;font-size:14px;font-weight:900;border-radius:20px;padding:6px 18px;display:inline-block;margin-bottom:12px;animation:badge-pop 0.5s cubic-bezier(.34,1.56,.64,1);}
@keyframes badge-pop{0%{transform:scale(0);}100%{transform:scale(1);}}
.leaderboard-link{font-size:12px;font-weight:700;color:var(--lav,#C4B5FF);text-decoration:none;opacity:0.7;display:block;margin-top:8px;}
.leaderboard-link:hover{opacity:1;}

.diff-row{display:flex;gap:8px;margin-bottom:12px;}
.diff-btn{flex:1;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--glass-bg);color:rgba(255,255,255,0.5);font-family:'Jua',sans-serif;font-size:13px;cursor:pointer;transition:all 0.18s;}
.diff-btn.active{background:linear-gradient(135deg,rgba(255,133,161,0.25),rgba(196,181,255,0.25));border-color:var(--pink);color:white;}

.start-best{font-size:13px;font-weight:800;color:var(--yellow);margin-bottom:18px;opacity:0.8;}

@media(min-width:600px){
  .app{max-width:560px;}
}
@media(min-width:900px){
  body{background:radial-gradient(ellipse at center,#1a0a2e,#06030f);}
  .app{max-width:860px;margin:0 auto;box-shadow:0 0 80px rgba(0,0,0,0.6);}
  .mole-grid{grid-template-columns:repeat(4,1fr)!important;max-width:580px;margin:0 auto;}
  .hud{max-width:580px;margin:0 auto;}
  .timer-wrap{max-width:580px;margin:0 auto 10px;}
}
@media(max-width:899px){
  .screen-card{margin-bottom:62px;}
}

    </div>

<script>
const HOLES = 9;
const DIFF = {
  easy:   {showTime:1200, interval:1400, maxActive:2},
  normal: {showTime:900,  interval:1000, maxActive:3},
  hard:   {showTime:600,  interval:700,  maxActive:4},
};
let diff = 'easy';
let score=0, combo=1, misses=0;
let gameTime=60, timeLeft=60;
let timerId=null, moleTimers=[], holes=[];
let coins = (()=>{ try{ const s=localStorage.getItem('mungyi_town_save'); return s?JSON.parse(s).coins||100:100; }catch(e){return 100;} })();
let gameActive=false;
let bestScore = parseInt(localStorage.getItem('mole_best')||'0', 10);
let isNewRecord = false;

function setDiff(d,btn){
  diff=d;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function buildGrid(){
  const grid=document.getElementById('mole-grid');
  grid.innerHTML='';
  holes=[];
  for(let i=0;i<HOLES;i++){
    const hole=document.createElement('div');
    hole.className='hole';
    hole.innerHTML=`
      <div class="hole-shadow"></div>
      <div class="hole-ground">
        <span class="mole hidden" id="mole-${i}">🐹</span>
      </div>
    `;
    hole.addEventListener('click',()=>whack(i));
    hole.addEventListener('touchstart',e=>{e.preventDefault();whack(i);},{passive:false});
    grid.appendChild(hole);
    holes.push({active:false, timer:null});
  }
}

function startGame(){
  document.getElementById('start-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  score=0;combo=1;misses=0;timeLeft=gameTime;gameActive=true;isNewRecord=false;
  buildGrid();
  updateHUD();
  startTimer();
  scheduleMoles();
}

function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft-=0.1;
    const pct=Math.max(0,timeLeft/gameTime*100);
    document.getElementById('timer-fill').style.width=pct+'%';
    document.getElementById('time-display').textContent=Math.ceil(Math.max(0,timeLeft));
    if(timeLeft<=0){clearInterval(timerId);endGame();}
  },100);
}

function scheduleMoles(){
  const cfg=DIFF[diff];
  function spawnNext(){
    if(!gameActive) return;
    const active=holes.filter(h=>h.active).length;
    if(active<cfg.maxActive){
      const available=holes.map((h,i)=>h.active?-1:i).filter(i=>i>=0);
      if(available.length){
        const idx=available[Math.floor(Math.random()*available.length)];
        showMole(idx, cfg.showTime);
      }
    }
    const next=cfg.interval*(0.8+Math.random()*0.4);
    const t=setTimeout(spawnNext,next);
    moleTimers.push(t);
  }
  spawnNext();
}

function showMole(idx, duration){
  if(!gameActive||holes[idx].active) return;
  holes[idx].active=true;
  const mole=document.getElementById(`mole-${idx}`);
  const r=Math.random();
  let type='normal';
  if(r<0.1) type='bomb';
  else if(r<0.25) type='gold';
  mole.textContent=type==='gold'?'🐭':type==='bomb'?'💣':'🐹';
  mole.dataset.type=type;
  mole.classList.remove('hidden');

  const t=setTimeout(()=>{
    if(holes[idx]&&holes[idx].active&&mole.dataset.type!=='bonked'){
      hideMole(idx);
      if(type!=='bomb'){
        misses++;
        combo=1;
        updateHUD();
        if(misses>=5) endGame();
      }
    }
  },duration);
  holes[idx].timer=t;
}

function hideMole(idx){
  holes[idx].active=false;
  clearTimeout(holes[idx].timer);
  const mole=document.getElementById(`mole-${idx}`);
  mole.classList.add('hidden');
  setTimeout(()=>mole.dataset.type='',200);
}

function vib(ms=40){if(navigator.vibrate)navigator.vibrate(ms);}

function whack(idx){
  if(!gameActive||!holes[idx].active) return;
  const mole=document.getElementById(`mole-${idx}`);
  const type=mole.dataset.type;
  if(!type||type==='bonked') return;

  mole.dataset.type='bonked';
  mole.classList.add('bonk');

  if(type==='bomb'){
    score=Math.max(0,score-50);combo=1;
    vib([80,40,80]);
    showPop(idx,'-50! 💥');
    hideMole(idx);
  } else {
    const pts=type==='gold'?30*combo:10*combo;
    score+=pts;combo++;
    vib(type==='gold'?[40,20,60]:40);
    showPop(idx,(type==='gold'?'🌟':'')+'+'+pts);
    hideMole(idx);
    timeLeft=Math.min(gameTime,timeLeft+0.5);
  }
  updateHUD();
}

function showPop(idx,text){
  const hole=document.getElementById('mole-grid').children[idx];
  const pop=document.createElement('div');
  pop.className='score-pop';
  pop.textContent=text;
  hole.appendChild(pop);
  setTimeout(()=>pop.remove(),700);
}

function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('combo').textContent='x'+combo;
  document.getElementById('miss').textContent=misses+'/5';
}

function endGame(){
  gameActive=false;
  clearInterval(timerId);

  /* 신기록/코인 즉시 적립 (광고 시청 여부 무관) */
  if(score > bestScore){
    bestScore = score;
    isNewRecord = true;
    localStorage.setItem('mole_best', bestScore);
    document.getElementById('best-display').textContent = bestScore;
  }
  const reward=Math.floor(score/5);
  coins+=reward;
  localStorage.setItem('mole_coins',coins);
  townAddCoins(reward);
  townBoostMungyi('happy',5);
  townRecordGame();
  document.getElementById('coins').textContent=coins;

  /* 광고 시청 후 계속하기 */
  if(typeof AdManager!=='undefined'){
    AdManager.showReward(
      function(){ startGame(); },
      function(){ showEndScreen(); }
    );
  } else {
    showEndScreen();
  }

  if(typeof saveGameScore!=='undefined') saveGameScore('mole', score);
  moleTimers.forEach(clearTimeout);
  moleTimers=[];
  holes.forEach((_,i)=>hideMole(i));
}

function showEndScreen(){
  const reward=Math.floor(score/5);
  const badge = document.getElementById('new-record-badge');
  if(isNewRecord){
    badge.style.display='block';
    document.getElementById('end-emoji').textContent='🏆';
    document.getElementById('end-title').textContent='신기록 달성!';
  } else {
    badge.style.display='none';
    document.getElementById('end-emoji').textContent=score>200?'🏆':score>100?'😊':'😅';
    document.getElementById('end-title').textContent=score>200?'대단해요!':score>100?'잘했어요!':'다시 도전!';
  }
  document.getElementById('end-score').textContent=score+'점';
  document.getElementById('end-best').textContent='최고: '+bestScore+'점';
  document.getElementById('end-coin').textContent='+'+reward+'🪙 획득!';
  document.getElementById('end-screen').style.display='flex';
}

function restartGame(){startGame();}

/* ── 공유 ── */
function shareScore(){
  const text = `🐹 뭉이 게임타운 두더지 잡기\n\n내 점수: ${score}점${isNewRecord?' ⭐ 신기록!':''}\n최고기록: ${bestScore}점\n\n나 이길 수 있어? 😈\nhttps://game.luckygrampus.com/game_mole.html`;
  if(navigator.share){
    navigator.share({ title:'🐹 두더지 잡기', text, url:'https://game.luckygrampus.com/game_mole.html' })
      .catch(()=>_copyText(text));
  } else {
    _copyText(text);
  }
}
function _copyText(t){
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(()=>alert('클립보드에 복사됐어요! 📋'));
  } else {
    const el=document.createElement('textarea');
    el.value=t; document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
    alert('클립보드에 복사됐어요! 📋');
  }
}

buildGrid();
document.getElementById('coins').textContent=coins;
document.getElementById('best-display').textContent=bestScore;

const _SK="mungyi_town_save";
function _load(){try{const s=localStorage.getItem(_SK);return s?JSON.parse(s):{coins:100,items:{snack:0,toy:0,medicine:0},mungyi:{hunger:80,happy:80,energy:80,clean:100},stats:{totalGamesPlayed:0}};}catch(e){return {coins:100,items:{},mungyi:{},stats:{}};}} 
function _save(s){try{localStorage.setItem(_SK,JSON.stringify(s));}catch(e){}}
function townAddCoins(n){const s=_load();s.coins=Math.max(0,(s.coins||0)+n);_save(s);}
function townBoostMungyi(type,n){const s=_load();if(s.mungyi){s.mungyi[type]=Math.min(100,(s.mungyi[type]||0)+n);_save(s);}}
function townRecordGame(){const s=_load();s.stats=s.stats||{};s.stats.totalGamesPlayed=(s.stats.totalGamesPlayed||0)+1;_save(s);}
</script>
