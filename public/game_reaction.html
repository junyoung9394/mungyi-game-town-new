<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800;900&display=swap');
:root{
  --bg:#0c0820;--surface:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.13);
  --pink:#FF85A1;--mint:#5EDFCA;--lavender:#C4B5FF;--peach:#FFB07C;--yellow:#FFE97F;
  --glass-bg:rgba(255,255,255,0.07);--glass-blur:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;display:flex;justify-content:center;min-height:100vh;background:var(--bg);}
.app{width:100%;max-width:420px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;}

.header{background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));border-bottom:1px solid var(--border);padding:14px 62px 14px 18px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10;}
.title{font-family:'Jua',sans-serif;font-size:20px;background:linear-gradient(135deg,var(--yellow),var(--peach));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.coin-box{background:rgba(255,231,127,0.12);border:1px solid rgba(255,231,127,0.25);border-radius:20px;padding:6px 14px;color:var(--yellow);font-weight:800;font-size:15px;}

/* Main tap area */
.tap-area{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;
  transition:background 0.4s ease;
  user-select:none;
  margin:16px;border-radius:28px;
}
.tap-area.wait{background:radial-gradient(ellipse at center,rgba(196,181,255,0.15) 0%,rgba(12,8,32,0.6) 70%);border:1px solid rgba(196,181,255,0.2);}
.tap-area.ready{background:radial-gradient(ellipse at center,rgba(255,133,161,0.2) 0%,rgba(12,8,32,0.6) 70%);border:1px solid rgba(255,133,161,0.3);}
.tap-area.go{background:radial-gradient(ellipse at center,rgba(94,223,202,0.3) 0%,rgba(12,8,32,0.7) 70%);border:2px solid rgba(94,223,202,0.5);box-shadow:0 0 40px rgba(94,223,202,0.2),inset 0 0 40px rgba(94,223,202,0.05);}
.tap-area.result{background:radial-gradient(ellipse at center,rgba(255,176,124,0.2) 0%,rgba(12,8,32,0.6) 70%);border:1px solid rgba(255,176,124,0.3);}

.tap-icon{font-size:80px;margin-bottom:16px;transition:transform 0.2s;animation:tap-float 2s ease-in-out infinite;}
@keyframes tap-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.tap-area.go .tap-icon{animation:go-pulse 0.4s ease-in-out infinite;}
@keyframes go-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

.tap-label{font-family:'Jua',sans-serif;font-size:26px;color:white;text-align:center;line-height:1.4;text-shadow:0 0 20px rgba(255,255,255,0.2);}
.tap-sub{font-size:14px;color:rgba(255,255,255,0.5);margin-top:10px;text-align:center;}

.result-time{font-family:'Jua',sans-serif;font-size:72px;color:var(--yellow);text-shadow:0 0 30px rgba(255,233,127,0.5);margin:8px 0;}
.result-grade{font-size:20px;font-weight:800;}

/* Ripple */
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.2);transform:scale(0);animation:ripple-expand 0.6s ease-out forwards;pointer-events:none;}
@keyframes ripple-expand{to{transform:scale(4);opacity:0;}}

/* Stats panel */
.stats-panel{padding:16px;background:var(--glass-bg);backdrop-filter:blur(10px);border-top:1px solid var(--border);margin:0 16px 0;border-radius:20px 20px 0 0;}
.stats-title{font-family:'Jua',sans-serif;font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:10px;text-align:center;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center;}
.stat-n{font-family:'Jua',sans-serif;font-size:16px;color:white;}
.stat-n.yellow{color:var(--yellow);}
.stat-n.mint{color:var(--mint);}
.stat-l{font-size:9px;color:rgba(255,255,255,0.4);margin-top:2px;}

/* History */
.history{padding:10px 16px 24px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.hist-chip{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.7);}
.hist-chip.best{background:rgba(255,233,127,0.12);border-color:rgba(255,233,127,0.3);color:var(--yellow);}

@media(min-width:600px){
  .app{max-width:600px;}
}
@media(min-width:900px){
  body{background:radial-gradient(ellipse at center,#1a0a2e,#06030f);}
  .app{max-width:860px;margin:0 auto;box-shadow:0 0 80px rgba(0,0,0,0.6);}
  .tap-area{min-height:360px;}
  .tap-icon{font-size:100px!important;}
  .tap-label{font-size:32px!important;}
  .stats-panel{max-width:860px;}
  .stats-row{max-width:700px;margin:0 auto;}
  .history{max-width:700px;margin:0 auto;}
}

<style>
#home-fab{
  position:fixed;top:12px;left:12px;z-index:9990;
  width:44px;height:44px;border-radius:50%;
  background:rgba(0,0,0,0.65);
  border:2px solid rgba(255,255,255,0.18);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;text-decoration:none;
  backdrop-filter:blur(10px);
  box-shadow:0 2px 12px rgba(0,0,0,0.4);
  transition:all 0.18s;
}
#home-fab:hover{background:rgba(255,133,161,0.4);border-color:var(--pink);transform:scale(1.1);}

<body>
<a href="index.html" id="home-fab" title="홈으로">🏠</a>
<div class="app">
  <div class="header">
    <div class="title">⚡ 반응속도</div>
    <div class="coin-box">🪙 <span id="coins">100</span></div>
  </div>

  <div class="tap-area wait" id="tap-area" onclick="handleTap(event)">
    <div class="tap-icon" id="tap-icon">👆</div>
    <div class="tap-label" id="tap-label">화면을 탭해서<br>시작!</div>
    <div class="tap-sub" id="tap-sub">초록색이 되면 바로 탭하세요</div>
  </div>

  <div class="stats-panel">
    <div class="stats-title">📊 내 기록</div>
    <div class="stats-row">
      <div class="stat"><div class="stat-n yellow" id="s-best">-</div><div class="stat-l">최고</div></div>
      <div class="stat"><div class="stat-n mint" id="s-avg">-</div><div class="stat-l">평균</div></div>
      <div class="stat"><div class="stat-n" id="s-tries">0</div><div class="stat-l">시도</div></div>
      <div class="stat"><div class="stat-n" id="s-coins">0</div><div class="stat-l">획득코인</div></div>
    </div>
  </div>

  <div class="history" id="history"></div>
</div>

<script>
function vib(ms=40){if(navigator.vibrate)navigator.vibrate(ms);}
let phase = 'wait';
let startTime = 0;
let waitTimer = null;
let coins = (()=>{ try{ const s=localStorage.getItem('mungyi_town_save'); return s?JSON.parse(s).coins||100:100; }catch(e){return 100;} })();
let records = JSON.parse(localStorage.getItem('react_records')||'[]');
let totalCoins = parseInt(localStorage.getItem('react_total_coins')||'0');

function save(g){
  townAddCoins(g.coin);
  townBoostMungyi('happy', 3);
  townRecordGame();
  if(typeof saveGameScore!=='undefined') saveGameScore('reaction', Math.max(0, 1000-records[records.length-1]));
  localStorage.setItem('react_records', JSON.stringify(records));
  localStorage.setItem('react_total_coins', totalCoins);
}

function gradeResult(ms){
  if(ms<150) return {text:'⚡ 신의 경지!', color:getComputedStyle(document.documentElement).getPropertyValue('--yellow').trim()||'#FFE97F', coin:50};
  if(ms<200) return {text:'🚀 슈퍼 빠름!', color:'#FF85A1', coin:30};
  if(ms<250) return {text:'🔥 매우 빠름!', color:'#FFB07C', coin:20};
  if(ms<350) return {text:'👍 빠름!',       color:'#5EDFCA', coin:10};
  if(ms<500) return {text:'😊 보통',         color:'#C4B5FF', coin:5};
  return           {text:'🐢 조금 느려요', color:'rgba(255,255,255,0.5)', coin:2};
}

function updateStatsUI(){
  document.getElementById('s-tries').textContent = records.length;
  document.getElementById('s-coins').textContent = totalCoins;
  document.getElementById('coins').textContent = coins;
  if(records.length>0){
    const best=Math.min(...records);
    const avg=Math.round(records.reduce((a,b)=>a+b,0)/records.length);
    document.getElementById('s-best').textContent = best+'ms';
    document.getElementById('s-avg').textContent = avg+'ms';
  }
}

function updateHistory(){
  const h=document.getElementById('history');
  h.innerHTML='';
  const last=records.slice(-8).reverse();
  const best=records.length?Math.min(...records):Infinity;
  last.forEach(r=>{
    const chip=document.createElement('div');
    chip.className='hist-chip'+(r===best?' best':'');
    chip.textContent=(r===best?'👑 ':'')+r+'ms';
    h.appendChild(chip);
  });
}

function handleTap(e){
  const area=document.getElementById('tap-area');
  const rect=area.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  const rip=document.createElement('div');
  const size=Math.max(rect.width,rect.height);
  rip.className='ripple';
  rip.style.cssText=`width:${size}px;height:${size}px;left:${x-size/2}px;top:${y-size/2}px;`;
  area.appendChild(rip);
  setTimeout(()=>rip.remove(),600);

  if(phase==='wait') startReady();
  else if(phase==='ready') tooEarly();
  else if(phase==='go') recordResult();
  else if(phase==='result') resetToWait();
}

function startReady(){
  phase='ready';
  const area=document.getElementById('tap-area');
  area.className='tap-area ready';
  document.getElementById('tap-icon').textContent='⏳';
  document.getElementById('tap-label').textContent='잠깐만요...';
  document.getElementById('tap-sub').textContent='초록색이 되면 탭!';

  const delay=1000+Math.random()*3000;
  waitTimer=setTimeout(()=>{
    phase='go';
    vib(60);
    area.className='tap-area go';
    document.getElementById('tap-icon').textContent='⚡';
    document.getElementById('tap-label').textContent='지금 탭!';
    document.getElementById('tap-sub').textContent='최대한 빨리!';
    startTime=Date.now();
  },delay);
}

function tooEarly(){
  clearTimeout(waitTimer);
  vib([80,40,80]);
  phase='result';
  const area=document.getElementById('tap-area');
  area.className='tap-area result';
  document.getElementById('tap-icon').textContent='😅';
  document.getElementById('tap-label').innerHTML='너무 일찍!<br><span style="font-size:16px;color:rgba(255,255,255,0.5)">다시 탭해서 재시도</span>';
  document.getElementById('tap-sub').textContent='';
}

function recordResult(){
  const elapsed=Date.now()-startTime;
  phase='result';
  records.push(elapsed);
  if(records.length>20) records=records.slice(-20);

  const g=gradeResult(elapsed);
  vib(elapsed<200?[20,10,20,10,40]:elapsed<350?[40,20,40]:80);
  coins+=g.coin;
  totalCoins+=g.coin;
  save(g);
  updateStatsUI();
  updateHistory();

  const area=document.getElementById('tap-area');
  area.className='tap-area result';
  area.innerHTML=`
    <div class="result-time">${elapsed}ms</div>
    <div class="tap-label" style="color:${g.color};text-shadow:0 0 20px ${g.color}">${g.text}</div>
    <div class="tap-sub">+${g.coin}🪙 획득! 탭해서 다시하기</div>
  `;
  area.onclick=e=>{
    area.onclick=null;
    resetToWait();
    setTimeout(()=>area.onclick=handleTap,100);
  };
}

function resetToWait(){
  phase='wait';
  clearTimeout(waitTimer);
  const area=document.getElementById('tap-area');
  area.className='tap-area wait';
  area.innerHTML=`
    <div class="tap-icon" id="tap-icon" style="font-size:80px;margin-bottom:16px;animation:tap-float 2s ease-in-out infinite;">👆</div>
    <div class="tap-label" id="tap-label" style="font-family:'Jua',sans-serif;font-size:26px;color:white;">화면을 탭해서<br>시작!</div>
    <div class="tap-sub" id="tap-sub" style="font-size:14px;color:rgba(255,255,255,0.5);margin-top:10px;">초록색이 되면 바로 탭하세요</div>
  `;
  area.onclick=handleTap;
}

updateStatsUI();
updateHistory();

const _SK="mungyi_town_save";
function _load(){try{const s=localStorage.getItem(_SK);return s?JSON.parse(s):{coins:100,items:{snack:0,toy:0,medicine:0},mungyi:{hunger:80,happy:80,energy:80,clean:100},stats:{totalGamesPlayed:0}};}catch(e){return {coins:100,items:{},mungyi:{},stats:{}};}}
function _save(s){try{localStorage.setItem(_SK,JSON.stringify(s));}catch(e){}}
function townAddCoins(n){const s=_load();s.coins=Math.max(0,(s.coins||0)+n);_save(s);}
function townBoostMungyi(type,n){const s=_load();if(s.mungyi){s.mungyi[type]=Math.min(100,(s.mungyi[type]||0)+n);_save(s);}}
function townRecordGame(){const s=_load();s.stats=s.stats||{};s.stats.totalGamesPlayed=(s.stats.totalGamesPlayed||0)+1;_save(s);}
</script>
</body>
